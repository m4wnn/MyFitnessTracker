[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "myfitnesstracker"
version = "0.1.0"
description = "Garmin Connect downloader, summarizer and analysis toolkit."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "garminconnect==0.3.3",
  "pandas>=2.2",
  "matplotlib>=3.9",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
